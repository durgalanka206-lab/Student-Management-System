<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CampusOS</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Converts 404 → redirect back to index with path encoded in query
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
